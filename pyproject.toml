[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcost-engine"
version = "0.1.0"
description = "Transaction cost engine for commish (commission + fees) and bid-ask spread. Market impact and residual costs are deferred."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tcost-engine = "tcost_engine.cli:main"
tcost = "tcost_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tcost_engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
